name: Quant Terminal Quality

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Audit repository structure
        run: python scripts/audit_repository.py

      - name: Collect the complete test suite
        run: pytest --collect-only -q

      - name: Run fail-closed validation gate
        run: python scripts/validate_fixed_income.py

      - name: Run the complete test suite
        run: pytest -q --disable-warnings

      - name: Coverage visibility
        run: pytest -q tests/test_fixed_income_*.py --cov=fixed_income --cov-report=term-missing --cov-fail-under=70
